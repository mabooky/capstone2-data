<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>곡 묶음 뷰어</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1a1d21;
    --muted: #697381;
    --line: #e3e6ea;
    --hover: #f3f5f7;
    --accent: #138a43;
    --chip: #eef1f4;
    --warn-bg: #fff1cc;
    --warn-ink: #7a5200;
    --bad-bg: #fde3e3;
    --bad-ink: #a02222;
    --ok-bg: #dff5e6;
    --ok-ink: #11602f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215;
      --panel: #1a1d22;
      --text: #e7eaee;
      --muted: #98a1ad;
      --line: #2a2f36;
      --hover: #22262c;
      --accent: #4ade80;
      --chip: #262b32;
      --warn-bg: #3b2f10;
      --warn-ink: #f3cb6b;
      --bad-bg: #3f1c1c;
      --bad-ink: #ff9c9c;
      --ok-bg: #16331f;
      --ok-ink: #86e2a6;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  button { font: inherit; color: inherit; }
  input[type="search"], select {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font: inherit;
  }
  .btn {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; cursor: pointer;
  }
  .btn:hover { background: var(--hover); }

  /* 상단 */
  .top {
    flex: none; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 18px; margin: 0; }
  .stats, .hint { color: var(--muted); font-size: 12.5px; }
  .top .spacer { flex: 1; }

  /* 좌우 분할 */
  .split {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 12px 16px;
  }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane-head { flex: none; display: grid; gap: 8px; padding-bottom: 10px; }
  .pane-title { display: flex; align-items: baseline; gap: 10px; }
  .pane-title h2 { margin: 0; font-size: 15px; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .tools input[type="search"] { flex: 1 1 auto; min-width: 0; }
  .check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  .summary { color: var(--muted); font-size: 12.5px; }
  .pane-body {
    flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px;
    border-radius: 12px;
  }
  .pane-body.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
  #sentinelG, #sentinelL { height: 1px; }

  /* 목록 */
  .row {
    display: grid; grid-template-columns: 44px minmax(0, 1.6fr) minmax(0, 1fr) 44px 64px;
    column-gap: 10px; align-items: center;
    padding: 7px 12px; border-top: 1px solid var(--line);
    cursor: grab;
  }
  .row:first-of-type { border-top: 0; }
  .row:hover { background: var(--hover); }
  .row.missing { background: var(--bad-bg); color: var(--bad-ink); }
  .row.drop-ok { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row.dragging { opacity: .45; }
  .group.ref { outline: 2px solid var(--accent); outline-offset: -2px; }
  .icon.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .ref-bar { display: flex; align-items: center; gap: 8px; background: var(--ok-bg); color: var(--ok-ink); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }
  .ref-bar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { color: var(--ok-ink); font-weight: 600; }
  .loose-list { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .group {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 12px; overflow: hidden;
  }
  .group.drop-ok { outline: 2px solid var(--accent); outline-offset: -2px; }
  .g-head {
    display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center;
    padding: 9px 12px; border-bottom: 1px solid var(--line);
  }
  .g-no { font-weight: 700; font-variant-numeric: tabular-nums; }
  .uuid {
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--chip); border: 0; border-radius: 6px; padding: 2px 7px; cursor: pointer;
  }
  .uuid:hover { outline: 1px solid var(--line); }
  .chip {
    display: inline-block; background: var(--chip); color: var(--muted);
    border-radius: 999px; padding: 1px 9px; font-size: 12px; white-space: nowrap;
  }
  .chip.bad { background: var(--bad-bg); color: var(--bad-ink); }
  .chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .thumb {
    width: 44px; height: 44px; border-radius: 6px; object-fit: cover;
    background: var(--chip); display: block;
  }
  .thumb.broken { visibility: hidden; }
  .main { min-width: 0; }
  .t-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-sub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-meta { color: var(--muted); font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-meta b { color: var(--text); font-weight: 600; }
  .album { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }
  .album small { display: block; font-size: 11.5px; opacity: .85; }
  .act { display: flex; gap: 4px; justify-content: flex-end; }
  .icon {
    border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
    width: 28px; height: 28px; display: inline-grid; place-items: center;
    cursor: pointer; text-decoration: none; font-size: 13px;
  }
  .icon:hover { background: var(--hover); }
  .flags { grid-column: 2 / -1; display: flex; gap: 6px; flex-wrap: wrap; }

  .empty, .panel {
    background: var(--panel); border: 1px dashed var(--line); border-radius: 12px;
    padding: 28px 20px; text-align: center; color: var(--muted);
  }
  .gate { margin: 16px; }
  .panel { text-align: left; border-style: solid; color: var(--text); max-width: 760px; }
  .panel h2 { margin: 0 0 8px; font-size: 16px; }
  .panel code, .empty code {
    background: var(--chip); padding: 1px 6px; border-radius: 5px;
    font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .panel p { margin: 6px 0; }
  .panel .buttons { display: flex; gap: 8px; margin-top: 12px; }
  .err { color: var(--bad-ink); margin-top: 8px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 20;
  }
  .toast.show { opacity: .95; }
</style>
</head>
<body>
<header class="top">
  <h1>곡 묶음 뷰어</h1>
  <span class="stats" id="stats"></span>
  <span class="spacer"></span>
  <span class="hint" id="hint" hidden>오른쪽 곡을 왼쪽 묶음에 끌어다 놓으면 들어가고, 오른쪽 곡끼리 겹치면 새 묶음이 되며, 묶음 안의 곡을 오른쪽으로 끌면 빠집니다.</span>
  <button class="btn" id="reload" type="button" hidden>다시 불러오기</button>
  <button class="btn" id="change" type="button" hidden>폴더 바꾸기</button>
</header>

<div id="gate" class="gate"></div>

<div class="split" id="split" hidden>
  <section class="pane">
    <div class="pane-head">
      <div class="pane-title"><h2>묶음</h2><span class="summary" id="summaryG"></span></div>
      <div class="tools">
        <input type="search" id="qG" placeholder="제목, 아티스트, 앨범, 곡 ID, 묶음 ID로 찾기" aria-label="묶음 검색">
        <select id="sort" aria-label="정렬">
          <option value="file">파일 순서</option>
          <option value="size">곡 많은 순</option>
        </select>
        <label class="check"><input type="checkbox" id="onlyWarn"> 점검이 필요한 묶음만</label>
      </div>
    </div>
    <div class="pane-body" id="bodyG">
      <div id="listG"></div>
      <div id="sentinelG"></div>
    </div>
  </section>
  <section class="pane">
    <div class="pane-head">
      <div class="pane-title"><h2>묶이지 않은 곡</h2><span class="summary" id="summaryL"></span></div>
      <div class="tools">
        <input type="search" id="qL" placeholder="제목, 아티스트, 앨범, 곡 ID로 찾기" aria-label="곡 검색">
      </div>
      <div class="ref-bar" id="refBar" hidden><span id="refText"></span><button class="btn" id="refClear" type="button">기준 해제</button></div>
    </div>
    <div class="pane-body" id="bodyL">
      <div class="loose-list" id="listL"></div>
      <div id="sentinelL"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

// ---- 설정 -------------------------------------------------------------------
const FILES = { groups: "track_groups.csv", tracks: "tracks.csv", albums: "albums.jsonl" };
const PAGE_SIZE = 30;               // 스크롤할 때마다 새로 그리는 항목 수
const SCROLL_MARGIN = 800;          // 목록 아래 이만큼(px) 안에 끝이 보이면 다음 항목을 그립니다.
const ID_RE = /^[0-9A-Za-z]{22}$/;
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const ALBUM_TYPES = { album: "앨범", single: "싱글", ep: "EP", compilation: "컴필레이션" };
const RW = { mode: "readwrite" };

// ---- 작은 도우미 ----------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString("ko-KR");
const hasVa = (t) => t.valence != null && t.arousal != null;
const sign = (v) => (v > 0 ? "+" : "") + v.toFixed(2);

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value == null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid);
  return node;
}

function toast(message) {
  const node = $("toast");
  node.textContent = message;
  node.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => node.classList.remove("show"), 2600);
}

async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const area = el("textarea", { style: "position:fixed;opacity:0" });
    area.value = text;
    document.body.append(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  toast(`${label}을(를) 복사했습니다.`);
}

function durationText(ms) {
  const seconds = Math.round(ms / 1000);
  return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
}

// ---- 폴더 핸들 기억 -----------------------------------------------------------------
// 고른 폴더를 브라우저(IndexedDB)에 기억해 두면 다음부터는 권한 확인만 하면 됩니다. 쓸 수 없는 환경이면 매번 고릅니다.
function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("track-groups-viewer", 1);
    request.onupgradeneeded = () => request.result.createObjectStore("handles");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function storedHandle() {
  try {
    const db = await openDb();
    return await new Promise((resolve, reject) => {
      const request = db.transaction("handles").objectStore("handles").get("dir");
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    });
  } catch { return null; }
}
async function rememberHandle(handle) {
  try {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("handles", "readwrite");
      tx.objectStore("handles").put(handle, "dir");
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch { /* 기억하지 못해도 동작에는 문제가 없습니다. */ }
}

// ---- 파일 읽기 ------------------------------------------------------------------
async function readLines(stream, onLine) {
  const reader = stream.getReader();
  let rest = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    rest += value;
    let from = 0, index;
    while ((index = rest.indexOf("\n", from)) !== -1) {
      onLine(rest.slice(from, index));
      from = index + 1;
    }
    rest = rest.slice(from);
  }
  if (rest) onLine(rest);
}

async function openFile(name, optional = false) {
  try {
    const handle = await state.dir.getFileHandle(name);
    return { handle, file: await handle.getFile() };
  } catch (error) {
    if (optional && error.name === "NotFoundError") return null;
    if (error.name === "NotFoundError") throw new Error(`선택한 폴더에 ${name}이(가) 없습니다.`);
    throw error;
  }
}

// CSV를 행 목록으로 바꿉니다. 따옴표 안의 쉼표, 줄바꿈, 겹따옴표를 처리합니다.
function parseCsv(text) {
  const rows = [];
  let row = [];
  let i = text.charCodeAt(0) === 0xfeff ? 1 : 0;
  const n = text.length;
  const plain = /[^,"\r\n]*/y;
  while (i < n) {
    let field;
    if (text[i] === '"') {
      i++;
      field = "";
      for (;;) {
        const j = text.indexOf('"', i);
        if (j === -1) { field += text.slice(i); i = n; break; }
        field += text.slice(i, j);
        if (text[j + 1] === '"') { field += '"'; i = j + 2; }
        else { i = j + 1; break; }
      }
    } else {
      plain.lastIndex = i;
      plain.test(text);
      field = text.slice(i, plain.lastIndex);
      i = plain.lastIndex;
    }
    row.push(field);
    const c = text[i];
    if (c === ",") { i++; if (i >= n) row.push(""); continue; }
    if (c === "\r" || c === "\n" || c === undefined) {
      if (c === "\r" && text[i + 1] === "\n") i++;
      i++;
      rows.push(row);
      row = [];
    }
  }
  if (row.length) rows.push(row);
  return rows.filter((r) => !(r.length === 1 && r[0] === ""));
}

// "{id1,id2}" 형식(PostgreSQL 배열)을 목록으로 바꿉니다.
function parseArray(text) {
  let value = text.trim();
  if (value.startsWith("{") && value.endsWith("}")) value = value.slice(1, -1);
  return value.split(",").map((x) => x.trim().replace(/^"|"$/g, "")).filter(Boolean);
}

// ---- 데이터 불러오기와 분석 --------------------------------------------------------
const state = {
  dir: null, groupsHandle: null, stamp: null, busy: false, drag: null,
  groups: [], tracks: new Map(), trackList: [], albums: new Map(), where: new Map(), loose: [],
  info: null, ref: null, scores: null,
};

async function loadData(setStatus) {
  const started = performance.now();

  setStatus(`${FILES.groups} 읽는 중…`);
  const groupFile = await openFile(FILES.groups);
  const groupRows = parseCsv(await groupFile.file.text());
  const header = groupRows[0] || [];
  if (header[0] !== "group_id" || header[1] !== "spotify_ids") {
    throw new Error(`${FILES.groups}의 머리글이 group_id,spotify_ids가 아닙니다.`);
  }
  const groups = groupRows.slice(1).map((r) => ({ id: (r[0] || "").trim(), ids: parseArray(r[1] || "") }));

  setStatus(`${FILES.tracks} 읽는 중…`);
  const trackRows = parseCsv(await (await openFile(FILES.tracks)).file.text());
  const col = Object.fromEntries((trackRows[0] || []).map((name, i) => [name, i]));
  for (const name of ["spotify_id", "title", "artist", "duration_ms", "album_id", "valence", "arousal"]) {
    if (!(name in col)) throw new Error(`${FILES.tracks}에 ${name} 열이 없습니다.`);
  }
  const tracks = new Map();
  const trackList = [];
  const albumIds = new Set();
  for (let i = 1; i < trackRows.length; i++) {
    const r = trackRows[i];
    const num = (name) => (r[col[name]] === "" || r[col[name]] == null ? null : Number(r[col[name]]));
    const track = {
      id: r[col.spotify_id],
      order: i,
      title: r[col.title],
      artist: r[col.artist],
      durationMs: num("duration_ms"),
      playCount: num("play_count"),
      albumId: r[col.album_id],
      thumb: r[col.album_thumb_url] || "",
      valence: num("valence"),
      arousal: num("arousal"),
      hay: null,
    };
    tracks.set(track.id, track);
    trackList.push(track);
    if (hasVa(track)) albumIds.add(track.albumId);
  }

  const albums = new Map();
  let albumsRead = 0;
  let hasAlbums = false;
  setStatus(`${FILES.albums} 읽는 중…`);
  try {
    const albumFile = await openFile(FILES.albums, true);
    if (albumFile) {
      hasAlbums = true;
      const head = /^\{"album_id":\s*"([0-9A-Za-z]{22})"/;
      await readLines(albumFile.file.stream().pipeThrough(new TextDecoderStream()), (line) => {
        albumsRead++;
        const m = head.exec(line);
        if (!m || !albumIds.has(m[1])) return;  // 필요한 앨범만 해석합니다.
        try {
          const album = JSON.parse(line).album;
          albums.set(m[1], {
            name: album.name,
            type: ALBUM_TYPES[album.album_type] || album.album_type || "",
            year: (album.release_date || "").slice(0, 4),
          });
        } catch { /* 깨진 줄은 건너뜁니다. */ }
      });
    }
  } catch {
    hasAlbums = false;  // 앨범 파일을 읽지 못해도 앨범명만 생략하고 계속 보여 줍니다.
  }

  state.groupsHandle = groupFile.handle;
  state.stamp = { mod: groupFile.file.lastModified, size: groupFile.file.size };
  state.groups = groups;
  state.tracks = tracks;
  state.trackList = trackList;
  state.albums = albums;
  state.info = { totalTracks: trackList.length, hasAlbums, albumsRead, seconds: (performance.now() - started) / 1000 };
  rebuild();
}

// 묶음 목록이 바뀔 때마다 번호, 점검 결과, 묶이지 않은 곡 목록을 다시 계산합니다.
function rebuild() {
  const { groups, tracks, albums } = state;
  const where = new Map();    // 곡 ID -> 그 곡이 들어 있는 묶음 번호들
  const idCount = new Map();  // group_id -> 등장 횟수
  groups.forEach((g, index) => {
    g.no = index + 1;
    idCount.set(g.id, (idCount.get(g.id) || 0) + 1);
    for (const id of new Set(g.ids)) {
      if (!where.has(id)) where.set(id, []);
      where.get(id).push(g.no);
    }
  });
  for (const g of groups) {
    g.problems = [];
    if (!g.id) g.problems.push("group_id가 비어 있음");
    else if (!UUID_RE.test(g.id)) g.problems.push("group_id가 UUID 형식이 아님");
    if (g.id && idCount.get(g.id) > 1) g.problems.push("group_id가 다른 행과 중복");
    if (g.ids.length < 2) g.problems.push("곡이 1개 이하");
    const unique = [...new Set(g.ids)];
    if (unique.length !== g.ids.length) g.problems.push("같은 곡이 묶음 안에서 반복");

    g.members = unique.map((id) => {
      const track = tracks.get(id) || null;
      const flags = [];
      if (!ID_RE.test(id)) flags.push("곡 ID 형식 오류");
      else if (!track) flags.push("tracks.csv에 없음");
      else if (!hasVa(track)) flags.push("(V, A)가 없는 곡");  // 묶음에는 (V, A)가 있는 곡만 넣습니다.
      const others = (where.get(id) || []).filter((no) => no !== g.no);
      if (others.length) flags.push(`#${others.join(", #")} 묶음에도 있음`);
      return { id, track, album: track ? albums.get(track.albumId) || null : null, flags };
    });
    const missing = g.members.filter((m) => m.flags.some((f) => f.startsWith("곡 ID") || f.startsWith("tracks.csv"))).length;
    const overlap = g.members.filter((m) => m.flags.some((f) => f.includes("묶음에도"))).length;
    const noVa = g.members.filter((m) => m.flags.includes("(V, A)가 없는 곡")).length;
    if (missing) g.problems.push(`찾을 수 없는 곡 ${missing}개`);
    if (noVa) g.problems.push(`(V, A)가 없는 곡 ${noVa}개`);
    if (overlap) g.problems.push(`다른 묶음과 겹치는 곡 ${overlap}개`);

    const durations = g.members.filter((m) => m.track && m.track.durationMs != null).map((m) => m.track.durationMs);
    g.durMin = durations.length ? Math.min(...durations) : null;
    g.durMax = durations.length ? Math.max(...durations) : null;
    g.needsCheck = g.problems.length > 0;
    g.haystack = null;
  }
  state.where = where;
  state.loose = state.trackList.filter((t) => hasVa(t) && !where.has(t.id));
}

// ---- 편집과 저장 ----------------------------------------------------------------------
function toCsv(groups) {
  return "group_id,spotify_ids\n" + groups.map((g) => `${g.id},"{${g.ids.join(",")}}"`).join("\n") + "\n";
}

async function saveGroups(next) {
  const handle = state.groupsHandle;
  if ((await handle.queryPermission(RW)) !== "granted" && (await handle.requestPermission(RW)) !== "granted") {
    throw new Error(`${FILES.groups}에 쓸 권한이 없습니다.`);
  }
  const current = await handle.getFile();
  if (current.lastModified !== state.stamp.mod || current.size !== state.stamp.size) {
    throw new Error(`${FILES.groups}가 이 화면 밖에서 바뀌었습니다. ‘다시 불러오기’를 누른 뒤 다시 시도하십시오.`);
  }
  const writable = await handle.createWritable();  // 닫을 때 한꺼번에 교체되므로 도중에 멈춰도 기존 파일이 남습니다.
  try {
    await writable.write(toCsv(next));
    await writable.close();
  } catch (error) {
    try { await writable.abort(); } catch { /* 이미 닫힌 경우입니다. */ }
    throw error;
  }
  const saved = await handle.getFile();
  state.stamp = { mod: saved.lastModified, size: saved.size };
}

// compute(next)가 묶음 복사본 next를 고치고 알림 문구를 돌려줍니다. 파일에 쓰는 데 성공한 뒤에만 화면에 반영합니다.
async function commit(compute) {
  if (state.busy) { toast("저장 중입니다. 잠시 뒤에 다시 시도하십시오."); return; }
  state.busy = true;
  try {
    const next = state.groups.map((g) => ({ id: g.id, ids: g.ids.slice() }));
    const message = compute(next);
    await saveGroups(next);
    state.groups = next;
    rebuild();
    if (state.ref && !computeScores()) dropRef();  // 기준 묶음이 없어졌으면 기준을 풉니다.
    showRefBar();
    refreshGroups(true);
    refreshLoose(true);
    showStats();
    toast(message);
  } catch (error) {
    toast(`저장하지 않았습니다. ${error.message}`);
  } finally {
    state.busy = false;
  }
}

function assertUsable(id) {
  const track = state.tracks.get(id);
  if (!track) throw new Error("tracks.csv에 없는 곡입니다.");
  if (!hasVa(track)) throw new Error("(V, A)가 없는 곡은 묶을 수 없습니다.");
}

// 묶음에서 곡을 뺍니다. 곡이 2개 미만으로 줄면 묶음을 없애고 알림 문구를 돌려줍니다.
function takeOut(next, id) {
  const source = next.find((g) => g.ids.includes(id));
  if (!source) return "";
  const no = next.indexOf(source) + 1;
  source.ids = source.ids.filter((x) => x !== id);
  if (source.ids.length >= 2) return "";
  next.splice(next.indexOf(source), 1);
  return ` 곡이 1개만 남은 #${no} 묶음은 없앴습니다.`;
}

function addToGroup(id, groupId) {
  return commit((next) => {
    const target = next.find((g) => g.id === groupId);
    if (!target) throw new Error("묶음을 찾을 수 없습니다.");
    if (target.ids.includes(id)) throw new Error("이미 그 묶음에 있는 곡입니다.");
    assertUsable(id);
    const note = takeOut(next, id);
    target.ids.push(id);
    target.ids.sort();
    return `곡을 #${next.indexOf(target) + 1} 묶음에 넣었습니다.${note}`;
  });
}

function removeFromGroup(id) {
  return commit((next) => {
    if (!next.some((g) => g.ids.includes(id))) throw new Error("묶음에 없는 곡입니다.");
    const note = takeOut(next, id);
    return `곡을 묶음에서 뺐습니다.${note}`;
  });
}

function createGroup(a, b) {
  return commit((next) => {
    if (a === b) throw new Error("서로 다른 곡이어야 합니다.");
    for (const id of [a, b]) {
      assertUsable(id);
      if (next.some((g) => g.ids.includes(id))) throw new Error("이미 묶음에 속한 곡입니다.");
    }
    const group = { id: crypto.randomUUID(), ids: [a, b].sort() };
    // 파일의 묶음 순서(곡이 tracks.csv에 나오는 순서)를 지키도록 알맞은 자리에 끼워 넣습니다.
    const order = (g) => Math.min(...g.ids.map((id) => (state.tracks.get(id) || { order: Infinity }).order));
    const mine = order(group);
    let index = next.findIndex((g) => order(g) > mine);
    if (index === -1) index = next.length;
    next.splice(index, 0, group);
    return `새 묶음 #${index + 1}을 만들었습니다.`;
  });
}

// ---- 화면 -------------------------------------------------------------------------
// 무한 스크롤 목록입니다. items를 PAGE_SIZE씩 이어서 그립니다.
function makeList(body, list, sentinel, build) {
  const L = { items: [], shown: 0 };
  L.fill = (min = 0) => {
    // 끝 표시가 화면 근처에 남아 있으면 스크롤하지 않아도 이어서 그립니다. (큰 화면에서 목록이 멈추지 않도록)
    while (L.shown < L.items.length) {
      const next = L.items.slice(L.shown, L.shown + PAGE_SIZE);
      L.shown += next.length;
      const fragment = document.createDocumentFragment();
      for (const item of next) fragment.append(build(item));
      list.append(fragment);
      if (L.shown >= min && sentinel.getBoundingClientRect().top > body.getBoundingClientRect().bottom + SCROLL_MARGIN) break;
    }
  };
  // keep이면 이미 그려 둔 만큼 다시 그리고 스크롤 위치를 지킵니다.
  L.reset = (items, keep) => {
    const min = keep ? L.shown : 0;
    const top = body.scrollTop;
    L.items = items;
    L.shown = 0;
    list.replaceChildren();
    if (!keep) body.scrollTop = 0;
    L.fill(min);
    if (keep) body.scrollTop = top;
  };
  new IntersectionObserver((entries) => { if (entries[0].isIntersecting) L.fill(); }, { root: body, rootMargin: `${SCROLL_MARGIN}px` })
    .observe(sentinel);
  return L;
}

let groupList, looseList;

function terms(id) {
  return $(id).value.trim().toLowerCase().split(/\s+/).filter(Boolean);
}

function groupHaystack(g) {
  if (g.haystack == null) {
    const parts = [g.id];
    for (const m of g.members) {
      parts.push(m.id);
      if (m.track) parts.push(m.track.title, m.track.artist);
      if (m.album) parts.push(m.album.name);
    }
    g.haystack = parts.join("\n").toLowerCase();
  }
  return g.haystack;
}

function trackHaystack(t) {
  if (t.hay == null) {
    const album = state.albums.get(t.albumId);
    t.hay = [t.id, t.title, t.artist, album ? album.name : ""].join("\n").toLowerCase();
  }
  return t.hay;
}

// ---- 제목 유사도 --------------------------------------------------------------------
// 3~5단계에서 쓴 제목 정리 규칙을 옮긴 것입니다. 버전 표식과 구두점을 떼고 글자와 숫자만 남깁니다.
const VOCAB = new Set(`inst instrumental instrument mr 경음악 반주 인스트 live 라이브 remaster remastered remastering 리마스터 edit edited radio album single extended short full tv size ver version 버전
remix remixes remixed mix 리믹스 믹스 sped up slowed down reverb nightcore acoustic 어쿠스틱 piano orchestra orchestral strings rearranged arrange arranged unplugged stripped acapella a cappella
japanese japan jp jpn english eng korean kor chinese cn mandarin spanish esp 일본어 영어 한국어 중국어 clean explicit original bonus track title demo digital the of and`.split(/\s+/));
const END = new Set(["ver", "version", "mix", "remix", "edit", "remaster", "remastered", "리마스터", "버전", "믹스", "track"]);
const START = new Set(["live", "라이브", "feat", "ft", "featuring", "with", "prod", "duet"]);
const TAIL = new Set(["inst", "instrumental", "mr", "반주", "경음악", "인스트"]);
const TOK = /[0-9a-z\u3131-\u318e\uac00-\ud7a3\u4e00-\u9fff]+/g;
const tokens = (text) => text.toLowerCase().match(TOK) || [];

function qualifies(segment) {
  const toks = tokens(segment);
  if (!toks.length) return false;
  if (START.has(toks[0])) return true;
  if (toks.every((t) => VOCAB.has(t) || /^\d+$/.test(t))) return true;
  return END.has(toks[toks.length - 1]);
}

function titleKey(title) {
  let t = title.normalize("NFKC");
  t = t.replace(/[\(\[]([^\)\]]*)[\)\]]/g, (m, segment) => (qualifies(segment) ? " " : m));
  const parts = t.split(/\s[-–~]\s*/);
  if (parts.length > 1) {
    const keep = [parts[0]];
    for (const part of parts.slice(1)) {
      const first = tokens(part)[0];
      if (first === "live" || first === "라이브") break;  // Live로 시작하는 덩어리와 그 뒤는 모두 뗍니다.
      keep.push(part);
    }
    while (keep.length > 1 && qualifies(keep[keep.length - 1])) keep.pop();
    t = keep.join(" - ");
  }
  const words = t.replace(/[\s\-–~\(\)\[\]]+/g, " ").trim().toLowerCase().split(" ");
  while (words.length > 1 && TAIL.has(words[words.length - 1].replace(/[^0-9a-z가-힣]/g, ""))) words.pop();
  return words.join("").replace(/[^0-9a-z\u3040-\u30ff\u3131-\u318e\uac00-\ud7a3\u4e00-\u9fff]/g, "");
}

// 글자 2개 단위(바이그램)의 집합입니다. 한 글자뿐이면 그 글자 하나입니다.
function titleGrams(track) {
  if (track.grams == null) {
    const key = titleKey(track.title);
    const grams = new Set();
    if (key.length === 1) grams.add(key);
    for (let i = 0; i + 1 < key.length; i++) grams.add(key.slice(i, i + 2));
    track.grams = grams;
  }
  return track.grams;
}

// 두 제목의 바이그램이 얼마나 겹치는지(Dice 계수, 0~1)입니다.
function similarity(a, b) {
  if (!a.size || !b.size) return 0;
  const [small, large] = a.size <= b.size ? [a, b] : [b, a];
  let common = 0;
  for (const gram of small) if (large.has(gram)) common++;
  return (2 * common) / (a.size + b.size);
}

// 기준 묶음을 정하면, 묶이지 않은 곡마다 묶음 안 곡들과의 제목 유사도 중 가장 높은 값을 점수로 씁니다.
function computeScores() {
  const group = state.groups.find((g) => g.id === state.ref);
  if (!group) return false;
  const refs = group.members.filter((m) => m.track).map((m) => titleGrams(m.track));
  const scores = new Map();
  for (const track of state.loose) scores.set(track.id, Math.max(0, ...refs.map((grams) => similarity(grams, titleGrams(track)))));
  state.scores = scores;
  return true;
}

function setRef(groupId) {
  state.ref = groupId;
  if (!computeScores()) { dropRef(); return; }
  showRefBar();
  refreshGroups(true);
  refreshLoose();
  $("bodyL").scrollTop = 0;
}

// 기준 묶음을 풀고 오른쪽 정렬을 원래대로 돌립니다. 화면을 다시 그릴지는 호출한 쪽이 정합니다.
function dropRef() {
  state.ref = null;
  state.scores = null;
  showRefBar();
}

function showRefBar() {
  const group = state.ref && state.groups.find((g) => g.id === state.ref);
  $("refBar").hidden = !group;
  if (group) {
    const first = group.members.find((m) => m.track);
    $("refText").textContent = `기준 묶음 #${group.no}${first ? `: ${first.track.title} — ${first.track.artist}` : ""} · 묶이지 않은 곡을 제목이 비슷한 순으로 정렬 중`;
  }
}

const scoreOf = (id) => (state.scores ? state.scores.get(id) ?? 0 : null);
const percent = (score) => `${Math.round(score * 100)}%`;

function refreshGroups(keep = false) {
  const all = state.groups;
  const words = terms("qG");
  const onlyWarn = $("onlyWarn").checked;
  let view = all.filter((g) => (!onlyWarn || g.needsCheck) && words.every((t) => groupHaystack(g).includes(t)));
  if ($("sort").value === "size") view = view.slice().sort((a, b) => b.members.length - a.members.length || a.no - b.no);
  const songs = view.reduce((sum, g) => sum + g.members.length, 0);
  $("summaryG").textContent = `${fmt(view.length)}개 (전체 ${fmt(all.length)}개) · 곡 ${fmt(songs)}개`;
  groupList.reset(view, keep);
  if (!view.length) {
    $("listG").append(el("div", { class: "empty", text: all.length ? "조건에 맞는 묶음이 없습니다." : "아직 묶음이 없습니다. 오른쪽에서 곡 두 개를 겹쳐 놓으면 만들 수 있습니다." }));
  }
}

function refreshLoose(keep = false) {
  const words = terms("qL");
  let view = state.loose.filter((t) => words.every((w) => trackHaystack(t).includes(w)));
  if (state.scores) view = view.slice().sort((a, b) => scoreOf(b.id) - scoreOf(a.id) || a.order - b.order);
  $("summaryL").textContent = `${fmt(view.length)}곡 (전체 ${fmt(state.loose.length)}곡)`;
  looseList.reset(view, keep);
  if (!view.length) {
    $("listL").append(el("div", { class: "empty", text: state.loose.length ? "조건에 맞는 곡이 없습니다." : "묶이지 않은 곡이 없습니다." }));
  }
}

function clearDrops() {
  for (const node of document.querySelectorAll(".drop-ok")) node.classList.remove("drop-ok");
}

function groupCard(g) {
  const head = el("div", { class: "g-head" },
    el("span", { class: "g-no", text: `#${g.no}` }),
    el("button", { class: "uuid", type: "button", title: `${g.id || "(비어 있음)"} — 눌러서 복사`, onclick: () => g.id && copyText(g.id, "묶음 ID") }, g.id ? g.id.slice(0, 8) : "ID 없음"),
    el("span", { class: "chip", text: `곡 ${g.members.length}개` }),
    g.durMin != null
      ? el("span", { class: "chip", text: durationText(g.durMin) !== durationText(g.durMax) ? `길이 ${durationText(g.durMin)}~${durationText(g.durMax)}` : `길이 ${durationText(g.durMin)}` })
      : null,
    g.problems.map((problem) => el("span", { class: "chip bad", text: problem })),
    !g.needsCheck ? el("span", { class: "chip ok", text: "이상 없음" }) : null,
    el("span", { style: "flex:1" }),
    el("button", { class: `icon${g.id === state.ref ? " on" : ""}`, type: "button", title: g.id === state.ref ? "기준 묶음입니다" : "이 묶음을 기준으로 묶이지 않은 곡을 제목이 비슷한 순으로 정렬", onclick: () => setRef(g.id) }, "◎"),
  );
  const card = el("article", { class: `group${g.id === state.ref ? " ref" : ""}` }, head, g.members.map((m) => trackRow(m, g.id)));
  card.addEventListener("dragover", (e) => {
    if (!state.drag || state.drag.from === g.id) return;
    e.preventDefault();
    card.classList.add("drop-ok");
  });
  card.addEventListener("dragleave", (e) => { if (!card.contains(e.relatedTarget)) card.classList.remove("drop-ok"); });
  card.addEventListener("drop", (e) => {
    e.preventDefault();
    const drag = state.drag;
    clearDrops();
    if (drag && drag.from !== g.id) addToGroup(drag.id, g.id);
  });
  return card;
}

function trackRow(member, groupId = null) {
  const { id, track, album, flags } = member;
  const link = el("a", { class: "icon", href: `https://open.spotify.com/track/${id}`, target: "_blank", rel: "noopener", title: "Spotify에서 열기", draggable: "false" }, "▶");
  const copy = el("button", { class: "icon", type: "button", title: "곡 ID 복사", onclick: () => copyText(id, "곡 ID") }, "⧉");
  let row;
  if (!track) {
    row = el("div", { class: "row missing" },
      el("span"),
      el("div", { class: "main" }, el("div", { class: "t-title", text: "곡 정보를 찾을 수 없습니다" }), el("div", { class: "t-sub", text: id })),
      el("span", { class: "album", text: flags.join(" · ") }), el("span"),
      el("div", { class: "act" }, copy),
    );
  } else {
    const thumb = track.thumb
      ? el("img", { class: "thumb", src: track.thumb, alt: "", loading: "lazy", decoding: "async", referrerpolicy: "no-referrer", draggable: "false" })
      : el("span", { class: "thumb" });
    thumb.addEventListener?.("error", () => thumb.classList.add("broken"));
    const albumName = album ? album.name : "(앨범 정보 없음)";
    const albumSub = album ? [album.type, album.year].filter(Boolean).join(" · ") : track.albumId;
    const score = groupId == null ? scoreOf(id) : null;
    const meta = [
      score != null ? el("span", { class: "score", text: `제목 유사도 ${percent(score)}` }) : null,
      track.playCount != null ? `재생 ${fmt(track.playCount)}` : null,
      hasVa(track) ? el("span", {}, el("b", { text: "V " }), sign(track.valence), " ", el("b", { text: "A " }), sign(track.arousal)) : "V/A 없음",
    ].filter(Boolean);
    const metaLine = el("div", { class: "t-meta" });
    meta.forEach((part, i) => metaLine.append(i ? " · " : "", part));
    row = el("div", { class: "row" },
      thumb,
      el("div", { class: "main" },
        el("div", { class: "t-title", title: track.title, text: track.title }),
        el("div", { class: "t-sub", title: track.artist, text: track.artist }),
        metaLine),
      el("div", { class: "album", title: `${albumName} (${albumSub})` }, albumName, el("small", { text: albumSub })),
      el("span", { class: "num", title: `${(track.durationMs / 1000).toFixed(1)}초`, text: durationText(track.durationMs) }),
      el("div", { class: "act" }, link, copy),
      flags.length ? el("div", { class: "flags" }, flags.map((f) => el("span", { class: "chip bad", text: f }))) : null,
    );
  }

  row.draggable = true;
  row.addEventListener("dragstart", (e) => {
    state.drag = { id, from: groupId };
    e.dataTransfer.setData("text/plain", id);
    e.dataTransfer.effectAllowed = "move";
    row.classList.add("dragging");
  });
  row.addEventListener("dragend", () => { state.drag = null; row.classList.remove("dragging"); clearDrops(); });
  if (groupId == null) {
    // 묶이지 않은 곡을 다른 묶이지 않은 곡 위에 놓으면 둘로 새 묶음을 만듭니다.
    row.addEventListener("dragover", (e) => {
      if (!state.drag || state.drag.from != null || state.drag.id === id) return;
      e.preventDefault();
      e.stopPropagation();
      row.classList.add("drop-ok");
    });
    row.addEventListener("dragleave", (e) => { if (!row.contains(e.relatedTarget)) row.classList.remove("drop-ok"); });
    row.addEventListener("drop", (e) => {
      const drag = state.drag;
      if (!drag || drag.from != null || drag.id === id) return;
      e.preventDefault();
      e.stopPropagation();
      clearDrops();
      createGroup(drag.id, id);
    });
  }
  return row;
}

function showStats() {
  const info = state.info;
  const parts = [`묶음 ${fmt(state.groups.length)}개`, `묶이지 않은 곡 ${fmt(state.loose.length)}곡`, `tracks.csv ${fmt(info.totalTracks)}곡`];
  if (!info.hasAlbums) parts.push("앨범 파일 없음(앨범명 생략)");
  parts.push(`${info.seconds.toFixed(1)}초`);
  $("stats").textContent = parts.join(" · ");
}

// ---- 폴더 고르기 ----------------------------------------------------------------------
function showGate(message, stored) {
  $("split").hidden = true;
  $("hint").hidden = true;
  $("reload").hidden = true;
  $("change").hidden = true;
  $("stats").textContent = "";
  const unsupported = typeof window.showDirectoryPicker !== "function";
  $("gate").replaceChildren(el("div", { class: "panel" },
    el("h2", { text: "데이터 폴더를 선택해 주세요" }),
    el("p", {}, el("code", { text: FILES.groups }), ", ", el("code", { text: FILES.tracks }), ", ", el("code", { text: FILES.albums }), "이 들어 있는 ", el("code", { text: "v4/data" }), " 폴더를 고르면 읽고, 묶음을 편집하면 ", el("code", { text: FILES.groups }), "에 바로 저장합니다."),
    el("p", { text: unsupported ? "이 브라우저는 폴더에 직접 쓰는 기능을 지원하지 않습니다. Chrome이나 Edge로 열어 주십시오." : "폴더는 이 브라우저가 기억하므로 다음부터는 권한만 확인하면 됩니다." }),
    unsupported ? null : el("div", { class: "buttons" },
      stored ? el("button", { class: "btn", type: "button", onclick: () => chooseDir(stored) }, `‘${stored.name}’ 폴더 다시 열기`) : null,
      el("button", { class: "btn", type: "button", onclick: () => chooseDir(null) }, "폴더 선택"),
    ),
    message ? el("div", { class: "err", text: message }) : null,
  ));
}

async function chooseDir(stored) {
  try {
    let handle = null;
    if (stored && (await stored.requestPermission(RW)) === "granted") handle = stored;
    if (!handle) handle = await window.showDirectoryPicker({ id: "track-groups", mode: "readwrite" });
    await rememberHandle(handle);
    state.dir = handle;
    await start();
  } catch (error) {
    if (error.name !== "AbortError") showGate(error.message, stored);
  }
}

// ---- 시작 -------------------------------------------------------------------------
async function start() {
  $("gate").replaceChildren();
  dropRef();
  $("hint").hidden = true;
  $("stats").textContent = "불러오는 중…";
  try {
    await loadData((text) => { $("stats").textContent = text; });
  } catch (error) {
    showGate(error.message, await storedHandle());
    return;
  }
  $("split").hidden = false;
  $("hint").hidden = false;
  $("reload").hidden = false;
  $("change").hidden = false;
  showStats();
  refreshGroups();
  refreshLoose();
}

async function boot() {
  if (typeof window.showDirectoryPicker !== "function") return showGate("", null);
  const stored = await storedHandle();
  if (stored && (await stored.queryPermission(RW)) === "granted") {
    state.dir = stored;
    return start();
  }
  showGate("", stored);
}

groupList = makeList($("bodyG"), $("listG"), $("sentinelG"), (g) => groupCard(g));
looseList = makeList($("bodyL"), $("listL"), $("sentinelL"), (t) => trackRow({ id: t.id, track: t, album: state.albums.get(t.albumId) || null, flags: [] }));

let timerG, timerL;
$("qG").addEventListener("input", () => { clearTimeout(timerG); timerG = setTimeout(() => refreshGroups(), 150); });
$("qL").addEventListener("input", () => { clearTimeout(timerL); timerL = setTimeout(() => refreshLoose(), 150); });
$("sort").addEventListener("change", () => refreshGroups());
$("onlyWarn").addEventListener("change", () => refreshGroups());
$("refClear").addEventListener("click", () => { dropRef(); refreshGroups(true); refreshLoose(); });
$("reload").addEventListener("click", () => start());
$("change").addEventListener("click", async () => showGate("", await storedHandle()));

// 묶음 안의 곡을 오른쪽 영역에 놓으면 묶음에서 뺍니다.
const bodyL = $("bodyL");
bodyL.addEventListener("dragover", (e) => {
  if (!state.drag || state.drag.from == null) return;
  e.preventDefault();
  bodyL.classList.add("drop-ok");
});
bodyL.addEventListener("dragleave", (e) => { if (!bodyL.contains(e.relatedTarget)) bodyL.classList.remove("drop-ok"); });
bodyL.addEventListener("drop", (e) => {
  const drag = state.drag;
  if (!drag || drag.from == null) return;
  e.preventDefault();
  clearDrops();
  removeFromGroup(drag.id);
});

boot();
</script>
</body>
